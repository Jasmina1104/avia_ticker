<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWings - Parvozlar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .flights-page {
            padding: 120px 0 60px;
            background: #f8fafc;
            min-height: 100vh;
        }
        
        .search-summary {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        .search-summary h2 {
            margin-bottom: 1rem;
            color: #1e293b;
        }
        
        .search-details {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        
        .search-detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #475569;
        }
        
        .search-detail-item i {
            color: #2563eb;
        }
        
        .flights-container {
            display: flex;
            gap: 2rem;
        }
        
        .filters-sidebar {
            flex: 0 0 280px;
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
        }
        
        .filter-section {
            margin-bottom: 2rem;
        }
        
        .filter-section h3 {
            margin-bottom: 1rem;
            color: #1e293b;
            font-size: 1.1rem;
        }
        
        .filter-option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.8rem;
            cursor: pointer;
        }
        
        .filter-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .filter-option label {
            cursor: pointer;
            color: #475569;
            flex: 1;
        }
        
        .price-range {
            margin: 1.5rem 0;
        }
        
        .price-inputs {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .price-inputs input {
            flex: 1;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        
        .flights-list {
            flex: 1;
        }
        
        .flight-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .flight-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }
        
        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .airline-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .airline-logo {
            width: 50px;
            height: 50px;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .flight-routes {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 8px;
        }
        
        .route-item {
            text-align: center;
            flex: 1;
        }
        
        .route-time {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 5px;
        }
        
        .route-city {
            color: #64748b;
            font-size: 0.9rem;
        }
        
        .route-duration {
            position: relative;
            flex: 2;
            text-align: center;
            padding: 0 20px;
        }
        
        .route-duration::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #cbd5e1;
        }
        
        .duration-text {
            position: relative;
            background: white;
            padding: 0 15px;
            color: #64748b;
            font-size: 0.9rem;
        }
        
        .flight-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #475569;
        }
        
        .detail-item i {
            color: #2563eb;
        }
        
        .flight-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
        }
        
        .flight-price {
            text-align: right;
        }
        
        .price-amount {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 5px;
        }
        
        .price-per-person {
            color: #64748b;
            font-size: 0.9rem;
        }
        
        .btn-book-flight {
            padding: 12px 24px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.3s;
        }
        
        .btn-book-flight:hover {
            background: #0da271;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 3rem;
        }
        
        .pagination-btn {
            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .pagination-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }
        
        .pagination-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        
        .no-flights {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .no-flights i {
            font-size: 48px;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }
        
        .no-flights h3 {
            color: #475569;
            margin-bottom: 0.5rem;
        }
        
        .no-flights p {
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }
        
        @media (max-width: 992px) {
            .flights-container {
                flex-direction: column;
            }
            
            .filters-sidebar {
                flex: none;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner">
        <div class="spinner-content">
            <i class="fas fa-plane"></i>
            <p>Parvozlar yuklanmoqda...</p>
        </div>
    </div>

    <!-- Navigation (index.html'dan kopiya) -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-plane"></i> SkyWings
            </a>
            
            <div class="nav-links">
                <a href="index.html">Bosh sahifa</a>
                <a href="flights.html" class="active">Parvozlar</a>
                <a href="#" id="myBookings">Mening buyurtmalarim</a>
                <a href="#">Yordam</a>
                <a href="admin/index.html" class="admin-link">Admin</a>
            </div>
            
            <div class="nav-actions">
                <select class="lang-select">
                    <option value="uz">O'zbek</option>
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
                
                <div class="user-menu">
                    <button class="btn-login" id="mainLoginBtn">
                        <i class="fas fa-user"></i> Kirish
                    </button>
                    <div class="user-dropdown">
                        <a href="#" id="profileLink"><i class="fas fa-user-circle"></i> Profil</a>
                        <a href="#" id="myTicketsLink"><i class="fas fa-ticket-alt"></i> Mening chiptalarim</a>
                        <a href="#" id="settingsLink"><i class="fas fa-cog"></i> Sozlamalar</a>
                        <a href="#" id="logoutLink"><i class="fas fa-sign-out-alt"></i> Chiqish</a>
                    </div>
                </div>
            </div>
            
            <button class="menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Flights Page -->
    <section class="flights-page">
        <div class="container">
            <!-- Search Summary -->
            <div class="search-summary">
                <h2 id="searchTitle">Parvoz natijalari</h2>
                <div class="search-details">
                    <div class="search-detail-item">
                        <i class="fas fa-plane-departure"></i>
                        <span id="fromCity">Toshkent (TAS)</span>
                    </div>
                    <div class="search-detail-item">
                        <i class="fas fa-plane-arrival"></i>
                        <span id="toCity">Istanbul (IST)</span>
                    </div>
                    <div class="search-detail-item">
                        <i class="far fa-calendar"></i>
                        <span id="departureDate">2025-12-16</span>
                    </div>
                    <div class="search-detail-item">
                        <i class="fas fa-users"></i>
                        <span id="passengerCount">1 kishi</span>
                    </div>
                </div>
            </div>

            <div class="flights-container">
                <!-- Filters Sidebar -->
                <div class="filters-sidebar">
                    <div class="filter-section">
                        <h3>Aviakompaniyalar</h3>
                        <div class="filter-option">
                            <input type="checkbox" id="airline1" checked>
                            <label for="airline1">Uzbekistan Airways</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="airline2" checked>
                            <label for="airline2">Turkish Airlines</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="airline3" checked>
                            <label for="airline3">Aeroflot</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="airline4" checked>
                            <label for="airline4">Emirates</label>
                        </div>
                    </div>
                    
                    <div class="filter-section">
                        <h3>Narx oralig'i</h3>
                        <div class="price-range">
                            <input type="range" id="priceSlider" min="100" max="1000" value="500" step="50">
                            <div class="price-inputs">
                                <input type="number" id="minPrice" value="100" min="100" max="1000">
                                <input type="number" id="maxPrice" value="1000" min="100" max="1000">
                            </div>
                        </div>
                    </div>
                    
                    <div class="filter-section">
                        <h3>Uchish vaqti</h3>
                        <div class="filter-option">
                            <input type="checkbox" id="time1" checked>
                            <label for="time1">Ertalab (00:00 - 12:00)</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="time2" checked>
                            <label for="time2">Kunduzi (12:00 - 18:00)</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="time3" checked>
                            <label for="time3">Kechqurun (18:00 - 00:00)</label>
                        </div>
                    </div>
                    
                    <button class="btn-primary" id="applyFilters" style="width: 100%; padding: 12px;">
                        Filtrlarni qo'llash
                    </button>
                </div>

                <!-- Flights List -->
                <div class="flights-list">
                    <div id="flightsList">
                        <!-- Flights will be loaded here -->
                    </div>
                    
                    <!-- Pagination -->
                    <div class="pagination" id="pagination">
                        <!-- Pagination will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Modals Container -->
    <div id="modalsContainer"></div>
    
    <!-- Notification Container -->
    <div id="notificationContainer"></div>

    <script src="js/auth.js"></script>
    <script src="js/flights.js"></script>
</body>
</html>
